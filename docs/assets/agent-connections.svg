<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">One agent with optional connections</title>
  <desc id="desc">A user's chosen agent or harness sits at the center. Four optional connections surround it: Home for agent definition and native files, Messaging to bridge chat to a compatible backend, Workboard for work coordination over CLI, MCP, or HTTP, and Router for model requests through a compatible client. None is required.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0c1014"/>
      <stop offset="1" stop-color="#111a1d"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="56%">
      <stop stop-color="#b5f76a" stop-opacity=".17"/>
      <stop offset=".54" stop-color="#b5f76a" stop-opacity=".035"/>
      <stop offset="1" stop-color="#b5f76a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <style>
      .label { font: 600 14px Inter,Segoe UI,Arial,sans-serif; letter-spacing: 2.4px; fill: #9ca8b0; }
      .heading { font: 700 46px Inter,Segoe UI,Arial,sans-serif; letter-spacing: -.8px; fill: #eff4f0; }
      .subhead { font: 400 18px Inter,Segoe UI,Arial,sans-serif; fill: #aebbc0; }
      .note { font: 500 14px Inter,Segoe UI,Arial,sans-serif; letter-spacing: .4px; fill: #b5f76a; }
      .node-title { font: 700 22px Inter,Segoe UI,Arial,sans-serif; fill: #eff4f0; }
      .node-copy { font: 400 15px Inter,Segoe UI,Arial,sans-serif; fill: #c0cbd0; }
      .center-kicker { font: 600 13px Inter,Segoe UI,Arial,sans-serif; letter-spacing: 1.8px; fill: #b5f76a; }
      .center-title { font: 700 29px Inter,Segoe UI,Arial,sans-serif; letter-spacing: -.3px; fill: #eff4f0; }
      .center-copy { font: 400 16px Inter,Segoe UI,Arial,sans-serif; fill: #b9c5c7; }
      .optional { font: 600 12px Inter,Segoe UI,Arial,sans-serif; letter-spacing: 1.1px; fill: #aab7bc; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M80 114H1520" stroke="#293239"/>
  <path d="M80 826H1520" stroke="#293239"/>
  <circle cx="800" cy="511" r="330" fill="url(#centerGlow)"/>
  <circle cx="800" cy="511" r="245" fill="none" stroke="#b5f76a" stroke-opacity=".09" stroke-dasharray="3 14"/>

  <text x="80" y="77" class="label">SOULSTEADS / FLEXIBLE CONNECTIONS</text>
  <text x="80" y="190" class="heading">One agent, optional connections.</text>
  <text x="80" y="228" class="subhead">Keep your chosen agent at the center. Add only the capabilities that help.</text>
  <rect x="1213" y="156" width="307" height="42" rx="21" fill="#17221a" stroke="#b5f76a" stroke-opacity=".38"/>
  <circle cx="1239" cy="177" r="5" fill="#b5f76a"/>
  <text x="1255" y="182" class="note">NO MANDATORY STACK</text>

  <!-- Optional guide lines; each terminates before the nodes. -->
  <g fill="none" stroke-linecap="round">
    <path d="M649 424 516 362" stroke="#b5f76a" stroke-opacity=".54" stroke-width="2" stroke-dasharray="7 9"/>
    <path d="M951 424 1084 362" stroke="#8cbdff" stroke-opacity=".56" stroke-width="2" stroke-dasharray="7 9"/>
    <path d="M649 598 516 660" stroke="#8cbdff" stroke-opacity=".56" stroke-width="2" stroke-dasharray="7 9"/>
    <path d="M951 598 1084 660" stroke="#b5f76a" stroke-opacity=".54" stroke-width="2" stroke-dasharray="7 9"/>
  </g>

  <!-- Home -->
  <g filter="url(#shadow)">
    <rect x="116" y="290" width="400" height="154" rx="20" fill="#12181d" stroke="#334048"/>
    <rect x="116" y="290" width="6" height="154" rx="3" fill="#b5f76a"/>
  </g>
  <g transform="translate(150 328)" fill="none" stroke="#b5f76a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 12 17 4l13 8v18l-13 8-13-8z"/>
    <path d="M17 17v21M4 12l13 8 13-8" opacity=".72"/>
  </g>
  <text x="204" y="334" class="node-title">Home</text>
  <text x="204" y="365" class="node-copy">Agent definition</text>
  <text x="204" y="389" class="node-copy">Native files</text>
  <text x="204" y="421" class="optional">OPTIONAL CONNECTION</text>

  <!-- Messaging -->
  <g filter="url(#shadow)">
    <rect x="1084" y="290" width="400" height="154" rx="20" fill="#12181d" stroke="#334048"/>
    <rect x="1478" y="290" width="6" height="154" rx="3" fill="#8cbdff"/>
  </g>
  <g transform="translate(1118 328)" fill="none" stroke="#8cbdff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 6h25a4 4 0 0 1 4 4v15a4 4 0 0 1-4 4H17l-8 7v-7H4a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4Z"/>
    <path d="M9 17h16M9 23h10" opacity=".72"/>
  </g>
  <text x="1172" y="334" class="node-title">Messaging</text>
  <text x="1172" y="365" class="node-copy">Chat bridge</text>
  <text x="1172" y="389" class="node-copy">Compatible agent backend</text>
  <text x="1172" y="421" class="optional">OPTIONAL CONNECTION</text>

  <!-- Workboard -->
  <g filter="url(#shadow)">
    <rect x="116" y="578" width="400" height="154" rx="20" fill="#12181d" stroke="#334048"/>
    <rect x="116" y="578" width="6" height="154" rx="3" fill="#8cbdff"/>
  </g>
  <g transform="translate(150 616)" fill="none" stroke="#8cbdff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="32" height="32" rx="5"/>
    <path d="M2 14h32M13 3v32M20 9h8M20 20h8" opacity=".72"/>
  </g>
  <text x="204" y="622" class="node-title">Workboard</text>
  <text x="204" y="653" class="node-copy">Work coordination</text>
  <text x="204" y="677" class="node-copy">CLI, MCP, or HTTP</text>
  <text x="204" y="709" class="optional">OPTIONAL CONNECTION</text>

  <!-- Router -->
  <g filter="url(#shadow)">
    <rect x="1084" y="578" width="400" height="154" rx="20" fill="#12181d" stroke="#334048"/>
    <rect x="1478" y="578" width="6" height="154" rx="3" fill="#b5f76a"/>
  </g>
  <g transform="translate(1118 616)" fill="none" stroke="#b5f76a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9h17M21 4l5 5-5 5M30 27H13M13 22l-5 5 5 5"/>
    <circle cx="17" cy="18" r="3" opacity=".72"/>
  </g>
  <text x="1172" y="622" class="node-title">Router</text>
  <text x="1172" y="653" class="node-copy">Model requests</text>
  <text x="1172" y="677" class="node-copy">Compatible client</text>
  <text x="1172" y="709" class="optional">OPTIONAL CONNECTION</text>

  <!-- Center agent -->
  <g filter="url(#shadow)">
    <rect x="625" y="396" width="350" height="230" rx="30" fill="#151e1b" stroke="#b5f76a" stroke-opacity=".72" stroke-width="2"/>
    <rect x="639" y="410" width="322" height="202" rx="22" fill="none" stroke="#b5f76a" stroke-opacity=".12"/>
  </g>
  <circle cx="800" cy="451" r="23" fill="#b5f76a" fill-opacity=".16" stroke="#b5f76a" stroke-opacity=".75"/>
  <g transform="translate(788 439)" fill="none" stroke="#b5f76a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="1" width="22" height="22" rx="5"/>
    <path d="M7 9h10M7 15h7"/>
  </g>
  <text x="800" y="500" text-anchor="middle" class="center-kicker">YOUR STARTING POINT</text>
  <text x="800" y="531" text-anchor="middle" class="center-title">User’s chosen agent</text>
  <text x="800" y="561" text-anchor="middle" class="center-title">/ harness</text>
  <text x="800" y="591" text-anchor="middle" class="center-copy">Works on its own. Connections stay optional.</text>

  <text x="80" y="865" class="subhead">No direct dependencies between capabilities. Your agent remains the center of the system.</text>
</svg>
