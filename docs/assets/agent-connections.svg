<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1048" viewBox="0 0 1600 1048" role="img" aria-labelledby="title desc">
  <title id="title">One agent with optional connections</title>
  <desc id="desc">A user's chosen agent or harness sits at the center. Four optional connections surround it: Home for agent definition and native files, Messaging to bridge chat to a compatible backend, Workboard for work coordination over CLI, MCP, or HTTP, and Router for model requests through a compatible client. None is required. Agent Forge runs workflows independently; its quick start needs no harness or model.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172433" flood-opacity=".10"/>
    </filter>
    <style>
      .label { font: 600 14px Inter,Segoe UI,Arial,sans-serif; letter-spacing: 2.4px; fill: #4b586a; }
      .heading { font: 700 46px Inter,Segoe UI,Arial,sans-serif; letter-spacing: -.8px; fill: #172433; }
      .subhead { font: 400 18px Inter,Segoe UI,Arial,sans-serif; fill: #435466; }
      .note { font: 500 14px Inter,Segoe UI,Arial,sans-serif; letter-spacing: .4px; fill: #41702a; }
      .node-title { font: 700 22px Inter,Segoe UI,Arial,sans-serif; fill: #172433; }
      .node-copy { font: 400 15px Inter,Segoe UI,Arial,sans-serif; fill: #435466; }
      .center-kicker { font: 600 13px Inter,Segoe UI,Arial,sans-serif; letter-spacing: 1.8px; fill: #41702a; }
      .center-title { font: 700 29px Inter,Segoe UI,Arial,sans-serif; letter-spacing: -.3px; fill: #172433; }
      .center-copy { font: 400 16px Inter,Segoe UI,Arial,sans-serif; fill: #435466; }
      .optional { font: 600 12px Inter,Segoe UI,Arial,sans-serif; letter-spacing: 1.1px; fill: #4b586a; }
    </style>
    <symbol id="glyph-harness" viewBox="0 0 48 48">
      <rect x="1" y="1" width="46" height="46" rx="11" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-opacity=".44"/>
      <g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="13" width="28" height="22" rx="5"/><path d="m16 20 4 4-4 4m9 0h7"/></g>
    </symbol>
    <symbol id="glyph-home" viewBox="0 0 48 48">
      <rect x="1" y="1" width="46" height="46" rx="11" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-opacity=".44"/>
      <g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m24 9 13 7v16l-13 7-13-7V16l13-7zM11 16l13 8 13-8M24 24v15"/></g>
    </symbol>
    <symbol id="glyph-messaging" viewBox="0 0 48 48">
      <rect x="1" y="1" width="46" height="46" rx="11" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-opacity=".44"/>
      <g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12h18a5 5 0 0 1 5 5v12a5 5 0 0 1-5 5h-9l-9 6v-6a5 5 0 0 1-5-5V17a5 5 0 0 1 5-5zM17 21h14m-14 6h9"/></g>
    </symbol>
    <symbol id="glyph-workboard" viewBox="0 0 48 48">
      <rect x="1" y="1" width="46" height="46" rx="11" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-opacity=".44"/>
      <g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="12" width="28" height="24" rx="4"/><path d="M10 20h28M20 20v16m6-10h6m-6 5h4"/></g>
    </symbol>
    <symbol id="glyph-router" viewBox="0 0 48 48">
      <rect x="1" y="1" width="46" height="46" rx="11" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-opacity=".44"/>
      <g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17h26m-6-6 6 6-6 6M38 31H12m6-6-6 6 6 6"/></g>
    </symbol>
    <symbol id="glyph-forge" viewBox="0 0 48 48">
      <rect x="1" y="1" width="46" height="46" rx="11" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-opacity=".44"/>
      <g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="20" width="8" height="8" rx="2"/><rect x="32" y="9" width="8" height="8" rx="2"/><rect x="32" y="31" width="8" height="8" rx="2"/><path d="M16 24h8m0 0v-7a4 4 0 0 1 4-4h4m-8 11v7a4 4 0 0 0 4 4h4"/></g>
    </symbol>
  </defs>

  <rect width="1600" height="1048" fill="#ffffff"/>
  <path d="M80 114H1520" stroke="#d7e0e9"/>
  <path d="M80 826H1520" stroke="#d7e0e9"/>
  <circle cx="800" cy="511" r="245" fill="none" stroke="#41702a" stroke-opacity=".20" stroke-dasharray="3 14"/>

  <text x="80" y="77" class="label">SOULSTEADS / FLEXIBLE CONNECTIONS</text>
  <text x="80" y="190" class="heading">One agent, optional connections.</text>
  <text x="80" y="228" class="subhead">Keep your chosen agent at the center. Add only the capabilities that help.</text>
  <rect x="1213" y="156" width="307" height="42" rx="21" fill="#eef6e7" stroke="#41702a" stroke-opacity=".38"/>
  <circle cx="1239" cy="177" r="5" fill="#41702a"/>
  <text x="1255" y="182" class="note">NO MANDATORY STACK</text>

  <!-- Optional guide lines; each terminates before the nodes. -->
  <g id="harness-connections" fill="none" stroke-linecap="round">
    <path d="M649 424 516 362" stroke="#41702a" stroke-opacity=".86" stroke-width="2.5" stroke-dasharray="7 9"/>
    <path d="M951 424 1084 362" stroke="#2a6499" stroke-opacity=".86" stroke-width="2.5" stroke-dasharray="7 9"/>
    <path d="M649 598 516 660" stroke="#2a6499" stroke-opacity=".86" stroke-width="2.5" stroke-dasharray="7 9"/>
    <path d="M951 598 1084 660" stroke="#41702a" stroke-opacity=".86" stroke-width="2.5" stroke-dasharray="7 9"/>
  </g>

  <!-- Home -->
  <g filter="url(#shadow)">
    <rect x="116" y="290" width="400" height="154" rx="20" fill="#f7f9fc" stroke="#bccbd9"/>
    <rect x="116" y="290" width="6" height="154" rx="3" fill="#41702a"/>
  </g>
  <use id="icon-home" href="#glyph-home" x="135" y="310" width="52" height="52" color="#41702a" aria-hidden="true"/>
  <text x="204" y="334" class="node-title">Home</text>
  <text x="204" y="365" class="node-copy">Agent definition</text>
  <text x="204" y="389" class="node-copy">Native files</text>
  <text x="204" y="421" class="optional">OPTIONAL CONNECTION</text>

  <!-- Messaging -->
  <g filter="url(#shadow)">
    <rect x="1084" y="290" width="400" height="154" rx="20" fill="#f7f9fc" stroke="#bccbd9"/>
    <rect x="1478" y="290" width="6" height="154" rx="3" fill="#2a6499"/>
  </g>
  <use id="icon-messaging" href="#glyph-messaging" x="1103" y="310" width="52" height="52" color="#2a6499" aria-hidden="true"/>
  <text x="1172" y="334" class="node-title">Messaging</text>
  <text x="1172" y="365" class="node-copy">Chat bridge</text>
  <text x="1172" y="389" class="node-copy">Compatible agent backend</text>
  <text x="1172" y="421" class="optional">OPTIONAL CONNECTION</text>

  <!-- Workboard -->
  <g filter="url(#shadow)">
    <rect x="116" y="578" width="400" height="154" rx="20" fill="#f7f9fc" stroke="#bccbd9"/>
    <rect x="116" y="578" width="6" height="154" rx="3" fill="#2a6499"/>
  </g>
  <use id="icon-workboard" href="#glyph-workboard" x="135" y="598" width="52" height="52" color="#2a6499" aria-hidden="true"/>
  <text x="204" y="622" class="node-title">Workboard</text>
  <text x="204" y="653" class="node-copy">Work coordination</text>
  <text x="204" y="677" class="node-copy">CLI, MCP, or HTTP</text>
  <text x="204" y="709" class="optional">OPTIONAL CONNECTION</text>

  <!-- Router -->
  <g filter="url(#shadow)">
    <rect x="1084" y="578" width="400" height="154" rx="20" fill="#f7f9fc" stroke="#bccbd9"/>
    <rect x="1478" y="578" width="6" height="154" rx="3" fill="#41702a"/>
  </g>
  <use id="icon-router" href="#glyph-router" x="1103" y="598" width="52" height="52" color="#41702a" aria-hidden="true"/>
  <text x="1172" y="622" class="node-title">Router</text>
  <text x="1172" y="653" class="node-copy">Model requests</text>
  <text x="1172" y="677" class="node-copy">Compatible client</text>
  <text x="1172" y="709" class="optional">OPTIONAL CONNECTION</text>

  <!-- Center agent -->
  <g filter="url(#shadow)">
    <rect x="625" y="396" width="350" height="230" rx="30" fill="#f2f8ed" stroke="#41702a" stroke-opacity=".72" stroke-width="2"/>
    <rect x="639" y="410" width="322" height="202" rx="22" fill="none" stroke="#41702a" stroke-opacity=".12"/>
  </g>
  <use id="icon-harness" href="#glyph-harness" x="774" y="425" width="52" height="52" color="#41702a" aria-hidden="true"/>
  <text x="800" y="500" text-anchor="middle" class="center-kicker">YOUR STARTING POINT</text>
  <text x="800" y="531" text-anchor="middle" class="center-title">User’s chosen agent</text>
  <text x="800" y="561" text-anchor="middle" class="center-title">/ harness</text>
  <text x="800" y="591" text-anchor="middle" class="center-copy">Works on its own. Connections stay optional.</text>

  <text x="80" y="865" class="subhead">No direct dependencies between capabilities. Your agent remains the center of the system.</text>
  <g id="standalone-forge">
    <rect x="80" y="902" width="1440" height="106" rx="20" fill="#f7f2fd" stroke="#b7a2ce"/>
    <rect x="80" y="902" width="6" height="106" rx="3" fill="#8058b3"/>
    <use id="icon-forge" href="#glyph-forge" x="104" y="929" width="52" height="52" color="#663e93" aria-hidden="true"/>
    <text x="173" y="940" class="optional" style="fill:#663e93">STANDALONE WORKFLOWS</text>
    <text x="173" y="974" class="node-title">Agent Forge</text>
    <line x1="476" y1="927" x2="476" y2="983" stroke="#b7a2ce"/>
    <text x="522" y="950" class="subhead">Run, schedule, and inspect workflows.</text>
    <text x="522" y="977" class="subhead">No agent needed to start</text>
  </g>
</svg>
